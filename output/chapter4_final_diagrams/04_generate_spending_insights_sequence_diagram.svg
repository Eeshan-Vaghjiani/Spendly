ont-weight="700" text-anchor="start" fill="#171717">alt  request rejected</text><line x1="760" y1="465" x2="530" y2="465" stroke="#444444" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="645" y="456" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#171717">4a. Rejection details</text><line x1="530" y1="520" x2="280" y2="520" stroke="#444444" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="405" y="511" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#171717">4b. Error envelope (401 / 422 / 503)</text><text x="560" y="552" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#171717">else  request accepted</text><line x1="760" y1="590" x2="530" y2="590" stroke="#444444" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="645" y="581" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#171717">4c. Authenticated user</text><line x1="530" y1="645" x2="1810" y2="645" stroke="#444444" stroke-width="1.4" marker-end="url(#arrow)"/><text x="1170" y="636" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#171717">5. Read user transactions and active budgets</text><line x1="1810" y1="695" x2="530" y2="695" stroke="#444444" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1170" y="686" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#171717">6. Return user-owned records</text><line x1="530" y1="750" x2="1010" y2="750" stroke="#444444" stroke-width="1.4" marker-end="url(#arrow)"/><text x="770" y="741" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#171717">7. Prepare weekly and transaction features</text><line x1="1010" y1="800" x2="530" y2="800" stroke="#444444" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="770" y="791" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#171717">8. Return history count and model inputs</text><rect x="490" y="830" width="860" height="155" rx="2" fill="none" stroke="#777777" stroke-width="1.3"/><text x="560" y="850" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#171717">alt  eight or more complete weeks</text><line x1="530" y1="890" x2="1260" y2="890" stroke="#444444" stroke-width="1.4" marker-end="url(#arrow)"/><text x="895" y="881" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#171717">9a. Run LSTM v1 forecast</text><line x1="1260" y1="925" x2="530" y2="925" stroke="#444444" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="895" y="916" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#171717">9b. Return next-week estimate</text><line x1="490" y1="945" x2="1350" y2="945" stroke="#444444" stroke-width="1.1" stroke-dasharray="6 5"/><text x="560" y="965" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#171717">else  fewer than eight complete weeks</text><text x="700" y="975" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#171717">9c. Use personal weekly-average fallback</text><line x1="530" y1="1025" x2="1260" y2="1025" stroke="#444444" stroke-width="1.4" marker-end="url(#arrow)"/><text x="895" y="1016" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#171717">10. Score expense features with Isolation Forest v1</text><line x1="1260" y1="1070" x2="530" y2="1070" stroke="#444444" 