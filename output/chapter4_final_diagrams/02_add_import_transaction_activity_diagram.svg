<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1640" viewBox="0 0 1200 1640" role="img"><defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#444444"/></marker>
      <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M9,0 L9,6 L0,3 z" fill="#444444"/></marker>
    </defs><rect width="1200" height="1640" fill="#ffffff"/><text x="600" y="48" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#171717">SPENDLY PERSONAL FINANCE MANAGEMENT SYSTEM</text><text x="600" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#777777" letter-spacing="1.2">ADD OR IMPORT TRANSACTION - ACTIVITY DIAGRAM</text><line x1="50" y1="98" x2="1150" y2="98" stroke="#171717" stroke-width="1.5"/><circle cx="600" cy="130" r="9" fill="#171717" stroke="#171717" stroke-width="1"/><line x1="600" y1="140" x2="600" y2="170" stroke="#444444" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="430" y="170" width="340" height="62" rx="10" fill="#ffffff" stroke="#444444" stroke-width="1.8"/><text x="600" y="196.6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#171717">Open Transactions and choose</text><text x="600" y="216.6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#171717">Add or Import</text><line x1="600" y1="232" x2="600" y2="278" stroke="#444444" stroke-width="1.7" marker-end="url(#arrow)"/><polygon points="600,278 725,330 600,382 475,330" fill="#ffffff" stroke="#444444" stroke-width="1.8"/><text x="600" y="334.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#171717">Entry method?</text><polyline points="475,330 255,330 255,405" fill="none" stroke="#444444" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="303.24" y="307" width="93.52" height="18" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="350" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#171717">Manual entry</text><polyline points="725,330 945,330 945,405" fill="none" stroke="#444444" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="810.2" y="307" width="79.6" height="18" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="850" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#171717">CSV import</text><rect x="100" y="405" width="310" height="75" rx="10" fill="#ffffff" stroke="#444444" stroke-width="1.8"/><text x="255" y="448.1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#171717">Enter transaction details</text><rect x="790" y="405" width="310" height="75" rx="10" fill="#ffffff" stroke="#444444" stroke-width="1.8"/><text x="945" y="448.1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#171717">Select and upload CSV file</text><line x1="255" y1="480" x2="255" y2="555" stroke="#444444" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="100" y="555" width="310" height="75" rx="10" fill="#ffffff" stroke="#444444" stroke-width="1.8"/><text x="255" y="588.1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#171717">Validate amount, date,</text><text x="255" y="608.1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#171717">type and category</text><line x1="945" y1="480" x2="945" y2="520" stroke="#444444" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="790" y="520" width="310" height="75" rx="10" fill="#ffffff" stroke="#444444" stroke-width="1.8"/><text x="945" y="553.1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#171717">Parse and normalise CSV</text><text x="945" y="573.1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#171717">rows</text><line x1="945" y1="595" x2="945" y2="635" stroke="#444444" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="790" y="635" width="310" height="75" rx="10" fill="#ffffff" stroke="#444444" stroke-width="1.8"/><text x="945" y="668.1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#171717">Validate required columns</text><text x="945" y="688.1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#171717">and row values</text><polyline points="255,630 255,750 600,750 600,790" fill="none" stroke="#444444" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="945,710 945,750 600,750" fill="none" stroke="#444444" stroke-width="1.7" stroke-linejoin="round"/><rect x="420" y="790" width="360" height="72" rx="10" fill="#ffffff" stroke="#444444" stroke-width="1.8"/><text x="600" y="821.6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#171717">Check duplicates and confirm</text><text x="600" y="841.6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#171717">category text</text><line x1="600" y1="862" x2="600" y2="905" stroke="#444444" stroke-width="1.7" marker-end="url(#arrow)"/><polygon points="600,905 735,963 600,1021 465,963" fill="#ffffff" stroke="#444444" stroke-width="1.8"/><text x="600" y="959.85" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#171717">Any validation, duplicate</text><text x="600" y="975.95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#171717">or category issue?</text><polyline points="735,963 960,963 960,1065" fill="none" stroke="#444444" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="828" y="939" width="34" height="18" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="845" y="950" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#171717">Yes</text><rect x="790" y="1065" width="340" height="80" rx="10" fill="#ffffff" stroke="#444444" stroke-width="1.8"/><text x="960" y="1100.875" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#171717">Show the affected row or field</text><text x="960" y="1119.625" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#171717">and request correction</text><polyline points="960,1145 960,1220 1125,1220 1125,370 945,370 945,405" fill="none" stroke="#444444" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/><polyline points="960,1145 960,1255 75,1255 75,370 255,370 255,405" fill="none" stroke="#444444" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1047.58" y="1178" width="124.83999999999999" height="17" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="1110" y="1188" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#171717">CSV: reselect file</text><rect x="76.01" y="1213" width="143.98" height="17" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="148" y="1223" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#171717">Manual: correct input</text><line x1="600" y1="1021" x2="600" y2="1080" stroke="#444444" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="613" y="1044" width="34" height="18" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/><text x="630" y="1055" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#171717">No</text><rect x="420" y="1080" width="360" height="68" rx="10" fill="#e7e7e7" stroke="#444444" stroke-width="1.8"/><text x="600" y="1119.6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#171717">Save transaction record(s)</text><line x1="600" y1="1148" x2="600" y2="1195" stroke="#444444" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="420" y="1195" width="360" height="72" rx="10" fill="#ffffff" stroke="#444444" stroke-width="1.8"/><text x="600" y="1226.6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#171717">Refresh spending summary and</text><text x="600" y="1246.6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#171717">budget progress</text><line x1="600" y1="1267" x2="600" y2="1320" stroke="#444444" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="420" y="1320" width="360" height="68" rx="10" fill="#ffffff" stroke="#444444" stroke-width="1.8"/><text x="600" y="1359.6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#171717">Display success confirmation</text><line x1="600" y1="1388" x2="600" y2="1450" stroke="#444444" stroke-width="1.7" marker-end="url(#arrow)"/><circle cx="600" cy="1466" r="12" fill="#ffffff" stroke="#171717" stroke-width="2"/><circle cx="600" cy="1466" r="6" fill="#171717" stroke="#171717" stroke-width="1"/><rect x="55" y="1510" width="1090" height="72" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="1.2"/><text x="80" y="1538" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#171717">Correction paths return to the relevant source input; detected issues never flow directly to save.</text><text x="80" y="1558" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#171717">Categories remain text values in the current schema; the UI may offer suggestions without a categories table.</text></svg>