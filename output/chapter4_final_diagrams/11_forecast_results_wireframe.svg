328" y="1575" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#777777">Transactions</text><circle cx="450" cy="1542" r="9" fill="#ffffff" stroke="#303030" stroke-width="1.2"/><text x="450" y="1575" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#777777">Budgets</text><circle cx="572" cy="1542" r="9" fill="#ffffff" stroke="#303030" stroke-width="1.2"/><text x="572" y="1575" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#777777">Analytics</text><circle cx="694" cy="1542" r="9" fill="#ffffff" stroke="#303030" stroke-width="1.2"/><text x="694" y="1575" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#777777">More</text><rect x="173" y="305" width="554" height="170" rx="10" fill="#303030" stroke="#303030" stroke-width="1.2"/><text x="191" y="337" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#ffffff">ESTIMATED SPENDING</text><text x="191" y="391" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#ffffff">KES 8,400</text><text x="191" y="431" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#ffffff">14 Sep - 20 Sep 2026</text><rect x="173" y="497" width="554" height="190" rx="10" fill="#ffffff" stroke="#777777" stroke-width="1.2"/><text x="189" y="527" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#171717">History available</text><text x="711" y="527" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="end" fill="#171717">62%</text><rect x="189" y="549" width="522" height="12" rx="6" fill="#e7e7e7" stroke="#e7e7e7" stroke-width="0"/><rect x="189" y="549" width="323.64" height="12" rx="6" fill="#303030" stroke="#303030" stroke-width="0"/><text x="189" y="588" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#171717">5 of 8 complete weeks</text><text x="189" y="616" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#777777">Fewer than eight weeks are available, so this estimate</text><text x="189" y="636" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#777777">uses your personal weekly-average fallback.</text><text x="189" y="656" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#777777">At eight weeks, Spendly uses the frozen LSTM v1 model.</text><rect x="173" y="709" width="554" height="112" rx="10" fill="#f2f2f2" stroke="#777777" stroke-width="1.2"/><text x="189" y="740" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#171717">Accuracy pending</text><text x="189" y="769" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#777777">Accuracy can be measured after the forecast week ends</text><text x="189" y="789" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#777777">and actual expenses have been recorded.</text><rect x="173" y="841" width="554" height="138" rx="10" fill="#ffffff" stroke="#777777" stroke-width="1.2"/><text x="189" y="872" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#171717">How to use this</text><text x="189" y="903" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#171717">Use the amount as a planning guide. Compare it with your</text><text x="189" y="925" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#171717">budget and adjust optional spending where practical.</text><rect x="173" y="999" width="554" height="118" rx="10" fill="#f2f2f2" stroke="#303030" stroke-width="1.2"/><text x="189" y="1028" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#171717">EXPERIMENTAL GUIDANCE</text><text x="189" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="11.8" font-weight="400" text-anchor="start" fill="#171717">This estimate is not a guaranteed outcome or financial advice.</text><text x="189" y="1078" font-family="Arial, Helvetica, sans-serif" font-size="11.8" font-weight="400" text-anchor="start" fill="#171717">No model learns from this screen or retrains during the request.</text><rect x="173" y="1141" width="150" height="42" rx="7" fill="#ffffff" stroke="#303030" stroke-width="1.3"/><text x="248" y="1167" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#171717">Back</text></svg>