<text x="352.5" y="983.26" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#176657" text-anchor="middle">Save transaction</text>
<circle cx="701" cy="250" r="16" fill="#EEF6F3" stroke="#176657" stroke-width="1.5"/>
<text x="701" y="254.94" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#176657" text-anchor="middle">1</text>
<text x="728" y="253.22" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#20262B" text-anchor="start">Reached from Transactions</text>
<text x="728" y="287.76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#58646B" text-anchor="start">The add action opens this page. Back returns to</text>
<text x="728" y="313.76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#58646B" text-anchor="start">history; the five-tab bottom bar is not shown on this</text>
<text x="728" y="339.76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#58646B" text-anchor="start">pushed page.</text>
<circle cx="701" cy="459" r="16" fill="#EEF6F3" stroke="#176657" stroke-width="1.5"/>
<text x="701" y="463.94" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#176657" text-anchor="middle">2</text>
<text x="728" y="462.22" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#20262B" text-anchor="start">Clear input controls</text>
<text x="728" y="496.76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#58646B" text-anchor="start">Amount is numeric; category is a text field. Income</text>
<text x="728" y="522.76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#58646B" text-anchor="start">and expense are mutually exclusive. Merchant or</text>
<text x="728" y="548.76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#58646B" text-anchor="start">source is optional.</text>
<circle cx="701" cy="668" r="16" fill="#EEF6F3" stroke="#176657" stroke-width="1.5"/>
<text x="701" y="672.94" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#176657" text-anchor="middle">3</text>
<text x="728" y="671.22" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#20262B" text-anchor="start">Recurring is a label</text>
<text x="728" y="705.76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#58646B" text-anchor="start">The switch tags a recurring payment. It does not</text>
<text x="728" y="731.76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#58646B" text-anchor="start">create a payment schedule or initiate any bank</text>
<text x="728" y="757.76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#58646B" text-anchor="start">transfer.</text>
<circle cx="701" cy="877" r="16" fill="#EEF6F3" stroke="#176657" stroke-width="1.5"/>
<text x="701" y="881.94" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#176657" text-anchor="middle">4</text>
<text x="728" y="880.22" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#20262B" text-anchor="start">Validate, save, return</text>
<text x="728" y="914.76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#58646B" text-anchor="start">Inline errors explain invalid values. Save is disabled</text>
<text x="728" y="940.76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#58646B" text-anchor="start">while submitting; success returns to transaction</text>
<text x="728" y="966.76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#58646B" text-anchor="start">history.</text>
<text x="130" y="1110.12" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#58646B" text-anchor="start">Illustrative values. This page records financial data; it does not move money.</text>
