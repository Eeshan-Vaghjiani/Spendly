# Leave room for Flutter, Android tools and the OS on a 16 GB development host.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# The project and pub cache can live on different Windows drive letters.
# Non-incremental Kotlin compilation avoids non-relocatable cross-drive caches.
kotlin.incremental=false
