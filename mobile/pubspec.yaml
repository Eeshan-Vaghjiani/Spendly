name: spending_support
description: Spendly personal finance forecasting and decision-support app.
publish_to: none
version: 1.3.1+6

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ">=2.6.1 <3.0.0"
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  file_picker: ^10.1.9
  intl: ^0.20.2
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/spending_support_logo.png
